# CI — rebuild, prove the committed artifact is current, then test.
#
# THE FAILURE THIS CATCHES
#
# `lib/` is committed build output. A test suite can be fully green against `src/` while `lib/` is
# one edit behind — and the consumer loads `lib/`. That is "tests green, artifact broken", and it is
# invisible unless CI rebuilds and diffs.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Show the runtime we are actually testing on
        run: node --version && npm --version

      - name: Check out the layer this store's lock is built on
        # ── WHY THIS REPO NEEDS A SIBLING CHECKOUT AT ALL ──────────────────────────────────────
        #
        # `src/lock.ts` does NOT own a lock implementation. It delegates to the SYNCHRONOUS LEASE
        # ADAPTER in `dsh-paradise` (`createSyncLeaseAdapter`), and that is deliberate: the older
        # `mkdir` lock had a real race (a reclaimer could delete the directory between `mkdir` and
        # writing `owner`, crashing the writer that had already won) and was replaced rather than
        # patched.
        #
        # `src/lease-bridge.ts` then FAILS CLOSED when the layer is absent — `acquireFileLock` throws
        # instead of silently using a racy lock. So on a machine without `dsh-paradise`, every write
        # path in this store dies, which is what the suite exercised here: `appendNegatives` is called
        # by a large share of the tests, and the multi-process ones spawn child processes that hit the
        # same wall.
        #
        # CI checked out ONLY this repo, so the layer was never present and the suite was red for a
        # reason that has nothing to do with the code under test.
        #
        # ⚠️ The checkout path MUST stay INSIDE this job's workspace. `actions/checkout` refuses a
        # destination it cannot prove is under `$GITHUB_WORKSPACE`:
        #
        #   Repository path '/home/runner/work/<repo>/dsh-paradise-checkout'
        #   is not under '/home/runner/work/<repo>/<repo>'
        #
        # So it lands in a staging directory inside the workspace and the next step MOVES it out to
        # the sibling position that `leaseSpecifiers()` probes (`../../dsh-paradise/index.js`,
        # `../dsh-paradise/index.js`, then the bare package name).
        uses: actions/checkout@v4
        with:
          repository: corvus-dsh/dsh-paradise
          path: .siblings/dsh-paradise

      - name: Check out the sibling whose transaction store the txn criteria read
        # `v096` reads `dsh-graft-slice/src/core/txn.ts` and `v287` reads its directory. The subject of
        # those criteria is 「the two plugins agree about one on-disk transaction format」 — a skip would
        # not test a weaker version of that contract, it would delete the contract.
        #
        # `repository:` without `ref:` means the sibling's DEFAULT BRANCH HEAD, not this machine's
        # state: 「本地全绿 ⇒ CI 绿」 no longer holds (recorded in README).
        uses: actions/checkout@v4
        with:
          repository: corvus-dsh/dsh-graft-slice
          path: .siblings/dsh-graft-slice

      - name: Place the layer where the lease probes expect it
        # The probes look for the DIRECTORY NAME `dsh-paradise` beside this repo, not the scoped
        # package name: `@corvus-dsh/dsh-paradise` is a module specifier, the folder is `dsh-paradise`.
        run: |
          set -e
          mv .siblings/dsh-paradise ../dsh-paradise
          mv .siblings/dsh-graft-slice ../dsh-graft-slice
          rm -rf .siblings
          node -e "console.log('lease layer at', require('node:fs').realpathSync('../dsh-paradise/index.js'))"
          node -e "console.log('graft at', require('node:fs').realpathSync('../dsh-graft-slice/src/core/txn.ts'))"

      - name: Record which sibling revisions these criteria ran against
        # lead §三十四: a cross-repo criterion that does not name the revision it compared is
        # unauditable — the same commit could pass today and fail tomorrow because a SIBLING moved.
        run: |
          set -e
          for sibling in dsh-paradise dsh-graft-slice; do
            echo "sibling $sibling@$(git -C "../$sibling" rev-parse --short HEAD)"
          done

      - name: Runtime dependencies are empty and dev tooling is allowlisted
        # B4-A 的「依赖为空门禁」。dependencies 会被装进用户的运行时，必须永远为空；
        # typescript 只能是精确锁版本的 devDependency（干净克隆里缺它的代价已实测）。
        run: node scripts/check-runtime-deps.mjs

      - name: The scripts that must be byte-identical actually are
        # lead §三十七：共享文件不是一个集合，是两个作用域（all4 / paradise+memory）。
        # 清单外的文件【允许】不同。清单自己也在 all4 里，否则「某仓少一条」会伪装成绿。
        run: node scripts/check-shared-sources.mjs

      - name: CI checkout layout matches what the mv steps assume
        run: node scripts/check-ci-layout.mjs

      - name: Comments do not claim what the manifest no longer says
        run: node scripts/check-doc-claims.mjs

      - name: Install (no dependencies expected)
        run: npm install --no-audit --no-fund

      - name: Prove the PUBLISHED layer resolves, not just the sibling
        # ── WHY THIS EXISTS IN ADDITION TO THE SIBLING CHECKOUT ─────────────────────────────────
        #
        # The sibling checkout proves the LOCK works against this repository's HEAD of `dsh-paradise`.
        # It does not prove a user who installs the published package can reach the layer, and those
        # are different questions:
        #
        #   sibling   -> `../../dsh-paradise/index.js`  (our probe, works in CI)
        #   published -> `@corvus-dsh/dsh-paradise`     (what a real install produces)
        #
        # `leaseSpecifiers()` tries the PACKAGE SPECIFIER FIRST, so a published install resolves with
        # no sibling at all. If that package were published without a working `main`, or with a
        # broken `exports` map, `acquireFileLock` would fail closed on every write — the store would
        # simply stop accepting writes for every user — and CI would stay green because it only ever
        # tested the sibling path.
        #
        # `not published yet` is NOT a failure: before the first release there is nothing to install,
        # and failing here would make the first publish impossible. What must fail is the ambiguous
        # state — the registry says it exists but npm cannot install it, or it installs without the
        # `createSyncLeaseAdapter` the lock needs.
        run: |
          set -e
          echo "── registry view of the peer dependency ──"
          if ! npm view @corvus-dsh/dsh-paradise versions --json --registry=https://registry.npmjs.org > /tmp/view.txt 2>/tmp/view.err; then
            if grep -q 'E404' /tmp/view.err; then
              echo "::notice::@corvus-dsh/dsh-paradise is NOT PUBLISHED YET — skipping the install probe."
              echo "Sibling checkout remains the only resolution path until the first release."
              exit 0
            fi
            echo "::error::registry lookup failed for a reason that is not 404:"
            cat /tmp/view.err
            exit 1
          fi
          # ── THE STAGING PLACEHOLDER IS NOT A RELEASE OF THIS CODE ────────────────────────────────
          # `npm stage publish` claims a brand-new name by publishing a PLACEHOLDER package whose
          # version is exactly `0.0.0-stage`. It is a real, installable version of the real name, and
          # it carries NO `main` and NO `exports` — because it is not a build of this repository at
          # all.
          #
          # MEASURED, and it is why this filter exists: before the placeholder, `npm view … version`
          # answered E404 and this gate skipped. With the placeholder live, the lookup SUCCEEDS, the
          # probe installs it, and `require('@corvus-dsh/dsh-paradise')` dies with MODULE_NOT_FOUND:
          #
          #     Error: Cannot find module '@corvus-dsh/dsh-paradise'
          #
          # …so CI went red for a reason that has nothing to do with the code under test.
          #
          # THE FILTER IS BY EXACT VERSION, NOT BY "ANY PRE-RELEASE": a genuine `0.9.0-beta.1` MUST
          # still be probed, and that is the release this gate exists to protect.
          PUBLISHED="$(tr -d '\n ' < /tmp/view.txt | grep -o '"[^"]*"' | tr -d '"' | grep -vx '0.0.0-stage' | tail -1 || true)"
          if [ -z "$PUBLISHED" ]; then
            echo "::notice::only the staging placeholder (0.0.0-stage) exists — there is no release to verify yet."
            echo "The first real release will be probed here."
            exit 0
          fi
          echo "published version to verify: $PUBLISHED"

          echo "── install it the way a consumer does ──"
          PROBE="$(mktemp -d)"
          cd "$PROBE"
          npm init -y > /dev/null
          if ! npm install --no-audit --no-fund "@corvus-dsh/dsh-paradise@$PUBLISHED" > /tmp/inst.txt 2>&1; then
            echo "::error::the published package exists but CANNOT BE INSTALLED — every consumer would hit this"
            cat /tmp/inst.txt
            exit 1
          fi
          echo "── and does it expose the SYNCHRONOUS LEASE this store's lock requires? ──"
          node -e "const m=require('@corvus-dsh/dsh-paradise'); const need=['createSyncLeaseAdapter','createDshAdapters','readDiskEvents','escapeSessionDirName']; const miss=need.filter(k=>typeof m[k]!=='function'); if(miss.length){console.error('missing exports:',miss);process.exit(1)} console.log('published layer exports ok:', need.join(', '))"

      - name: Build
        run: npm run build

      - name: The build must not leave the committed artifact stale
        # WHY `git diff --exit-code` AND NOT `git status --porcelain`
        #
        # The question is "did the build change what ships". `git status` does not answer that
        # question: it compares against the stat cache and folds in attributes, so it can print
        # ` M` for a worktree file whose filtered CONTENT is identical to the committed blob (the
        # "LF will be replaced by CRLF the next time Git touches it" case).
        #
        # `git diff --exit-code` compares content after the repo's configured filters, which is the
        # same normalization `git status` applies — so it agrees with `status` on real edits but not
        # on pending-EOL noise. That is exactly the discrimination this gate needs.
        #
        # ⚠️ DO NOT "fix" this by pinning `core.autocrlf=false`. That disables the normalization
        # instead of relying on it, and on a worktree with CRLF bytes it turns pure EOL churn into a
        # whole-file diff. Measured on this repo: `lib/index.js` has 1664 CR bytes in the worktree,
        # plain `git diff` exits 0, and `git -c core.autocrlf=false diff` reports 7 files changed /
        # 7674 insertions / 7674 deletions of NOTHING. The pinned form fails on every Windows machine
        # while the real gate passes on both.
        run: |
          if ! git diff --exit-code -- lib; then
            echo "::error::The build changed committed artifacts. Run 'npm run build' and commit the result."
            git --no-pager diff --stat -- lib
            exit 1
          fi
          echo "ok: lib/ matches the committed artifact"

      - name: Syntax-check the shipped entry point
        run: node --check lib/index.js

      - name: Test
        # ── WHY THE SKIP LINES GO INTO THE JOB SUMMARY ──────────────────────────────────────
        #
        # 13 tests in this repo CANNOT run on CI: four files need the TypeScript compiler API
        # (`scripts/closure.mjs`) and this package declares no dependencies, so `npm install`
        # installs nothing; one more test needs a git history that a shallow clone does not have.
        # They are enumerated in `ARCHITECTURE.md` TD-M15 and `MODULE-REGISTRY.md`.
        #
        # So a green Test step proves **484 of 497**, not all of them. Until now, finding out
        # WHICH ones were skipped meant downloading the raw job log — which made the boundary
        # easy to forget and easy to misreport as "everything ran". Printing the skip lines into
        # `$GITHUB_STEP_SUMMARY` puts the boundary on the run's landing page, next to the green
        # checkmark it qualifies.
        #
        # The step still fails exactly when `npm test` fails: the exit status is captured,
        # the summary is written either way, and the status is re-raised at the end.
        run: |
          set -o pipefail
          status=0
          npm test 2>&1 | tee test-output.log || status=$?
          {
            echo '### Test suite'
            echo
            echo '| metric | count |'
            echo '|---|---|'
            grep -E '^ℹ (tests|pass|fail|skipped) ' test-output.log \
              | sed -E 's/^ℹ ([a-z]+) +([0-9]+)$/| \1 | \2 |/' || true
            echo
            echo '<details><summary>Skipped / RESOURCE — CI 不覆盖的就是这些（条数以 `ARCHITECTURE.md` 的 TD-M15 为准）</summary>'
            echo
            echo '```'
            grep -E '^(﹣|✖).*# |^# SKIP|RESOURCE' test-output.log || echo '(none)'
            echo '```'
            echo
            echo '判据、理由与「CI 到底覆盖了什么」见 `ARCHITECTURE.md` 的 **TD-M15**。'
            echo '**CI 绿 ≠ 这 13 条过了。**'
            echo '</details>'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          exit $status

      # ── THE DOCUMENT COUNT GATE, NOW ACTUALLY RUN ────────────────────────────────────────────────
      #
      # `check-readme-counts` existed here and was never run on a push, so the repository shipped with
      # SIX stale claims that a green CI said nothing about — measured on 2026-11-16, before this step:
      #
      #   FAIL L106  README 声明测试数 495 / 495，实测 516
      #   FAIL L537  README 声明测试数 495 / 495，实测 516
      #   FAIL ARCHITECTURE L135/136/137/140  有数字但既无「现状」也无时点限定
      #
      # All six are fixed in this commit and the step below is what keeps them fixed. It is the same
      # failure mode this repo already wrote down for other repos: "A gate nobody runs is a comment."
      #
      # ⚠️ It runs AFTER `npm test` on purpose. The guard measures the pass count itself (in its own
      # child process, so `npm run check` runs the suite twice — that is a known, accepted cost, NOT a
      # reason to weaken the guard). If the suite were red the guard would report that instead of a
      # stale number, so the behavioural break must surface first, with a test name to read.
      - name: Documentation counts match the code
        run: node scripts/check-readme-counts.mjs

      # ── TEST NUMBERS ARE UNIQUE WITHIN A REPOSITORY ──────────────────────────────────────────────
      #
      # Measured 2026-11-21 (B4-0b-2 W5-1): this repository already shares 9 numbers between files
      # (`v091` four times, `v102` three, `v032` three, …). Renaming them would be a mass rename of
      # filenames that commit messages cite, so the gate BASELINES what exists and refuses any NEW
      # collision — the same shape as the count gate above: the stock is recorded, the growth is
      # refused. A baseline LARGER than reality is refused too: it is headroom for the next file.
      #
      # Scope is per repository, not across the workspace: `v283` is a memory number and graft's
      # numbering is independent, so a report citing a number must name its repository.
      - name: Test numbers unique within this repository (no NEW collision)
        run: node scripts/check-test-numbers.mjs

      # ── BOOKKEEPING BEFORE FACT ────────────────────────────────────────────────────────────────
      #
      # 五形态之四「记账先于事实」. The literal judgement (`state.X += 1` before `await execute`) would
      # flag 279 counting sites in this repository, almost none of them IO — a to-read list nobody
      # reads. This implements the decidable core, which is the shape the batch actually paid for:
      #
      #   写一条知识 → 报告写进去了多少条 → 只有写了才盖 harvestedAt 章
      #
      # Two gates are accepted (an inline ternary and an `if … return` guard). Comments are blanked
      # before any decision is looked for: the can-red proved that the prose explaining the rule
      # otherwise satisfies the check for the rule.
      - name: A stamp sits behind the write's own answer
        run: node scripts/check-stamp-after-write.mjs

      # ── EVERY SCAN VERDICT CARRIES ITS DENOMINATOR ─────────────────────────────────────────────
      #
      # 五形态之三「保证语不实」. 「全绿」 prints identically for three different situations — scanned
      # N things / scanned ZERO things / scanned the WRONG place (§〇 17) — and the denominator is the
      # only thing that separates them.
      #
      # Scope is deliberate: only sentences whose subject is a SCAN. A per-case `PASS <name>` line and
      # a `built N module(s)` line are not scan verdicts, and demanding a number there is noise that
      # gets the gate switched off.
      - name: Every scan verdict carries its denominator
        run: node scripts/check-guarantee-denominators.mjs

      # ── ONE NAME, ONE QUESTION ──────────────────────────────────────────────────────────────────
      #
      # 五形态之一「判据分裂」. Measured 2026-11-21: `src/archive.ts` and `src/dedupe.ts` BOTH exported
      # `whenSimilarity` — same signature, same stated purpose — and answered 0.000 vs 0.909 for the
      # same pair of sentences. Both answers were right in their own context (archive ABSORBS a skill,
      # so digits must distinguish; dedupe LINKS records, where digits are noise), which is why the
      # fix was to let the NAME say which question it answers, not to merge them.
      #
      # This gate refuses a name defined in two modules. Re-exports are not definitions.
      - name: No exported name defined in more than one module
        run: node scripts/check-duplicate-export-names.mjs

      # ── NO NEW SILENT CATCH ─────────────────────────────────────────────────────────────────────
      #
      # 五形态之五「静默丢弃」. Measured on first run: 37 of 134 catch bodies have no statement and only
      # a short comment. Each is defensible in place, and rewriting all 37 to satisfy a length rule
      # would produce comments written for the checker — so the stock is baselined (as a MULTISET per
      # file, because copying an existing `/* ignore */` into a new catch is the natural way to add
      # one) and the growth is refused.
      #
      # This is the shape that cost this project most: a caught error turned into an empty value, and
      # the caller could not tell 「读到了空的」 from 「读失败了」.
      - name: No new silent catch block
        run: node scripts/check-silent-catch.mjs

      # ── FRONTMATTER READS HAVE ONE HOME ─────────────────────────────────────────────────────────
      #
      # This gate ran in `npm run check` and NEVER on a push — measured 2026-11-21 by
      # `scripts/check-check-parity.mjs`, which reported exactly two gaps (`check-cycles` and this

      # ── TD-B1: THE SHIPPED BUNDLE MUST BE WHAT THIS SOURCE BUILDS ─────────────────────────────
      #
      # Measured before this step existed: this repository had ZERO artifact scripts, so
      # 「the shipped bundle is the source」 was a claim nobody could check without a human
      # rebuild and a visual diff. The script rebuilds, then compares every artifact git TRACKS
      # byte for byte — the set that ships is the INDEX's set, not a glob of the build's.
      - name: artifact freshness (committed bundle == source build)
        run: node scripts/check-artifact-fresh.mjs
      # one). The consequence was specific: B4-0b-2 W5-2 fixed three copies of `^key:\s*(` that the
      # gate had been unable to see (template literals spell `\s` with two backslashes), and the
      # guard against a FOURTH copy was itself unwired. A fix whose guard never runs is a fix with an
      # expiry date.
      - name: Frontmatter reads go through the single reader
        run: node scripts/check-frontmatter-reads.mjs

      # ── DEPENDENCY CYCLES ───────────────────────────────────────────────────────────────────────
      #
      # Also local-only until 2026-11-21 (`check-check-parity.mjs` named it first). `check-cycles`
      # exits non-zero on a real cycle, so it needs no wrapper — unlike `type-budget`, which goes
      # through `run-gate.mjs` because a missing compiler is a RESOURCE condition, not a failure.
      - name: No dependency cycles
        run: node scripts/check-cycles.mjs

      # ── THE TWO LISTS MUST NOT DRIFT AGAIN ──────────────────────────────────────────────────────
      #
      # The defect this step prevents is the one that created this section: `package.json`'s `check`
      # and this file are two lists, maintained separately, and the repository had already paid for
      # the drift twice. The gate compares them; the build steps are exempt BY NAME (both repositories
      # build in their own CI step, which is the same module).
      #
      # It runs LAST among the gates on purpose: it should report on a complete answer, not race the
      # steps it is checking.
      - name: check parity (every local gate is also a CI step)
        run: node scripts/check-check-parity.mjs

      # ── THE TYPE BUDGET, WHICH THIS REPO'S CI NEVER RAN AT ALL ──────────────────────────────────
      #
      # Measured 2026-11-16: `npm run check` called `node scripts/type-budget.mjs` BARE, and ci.yml
      # did not mention it. Two consequences, and the second is the dangerous one:
      #
      #   1. this repository's type budget was never enforced on a push;
      #   2. the bare call exits **2** on a machine without `typescript`, so `npm run check` would be
      #      red there — and that is invisible HERE, because `typescript` resolves from
      #      `D:\持久层能力架构\node_modules`, one directory above this repo.
      #
      # "Green only on this machine" is the same disease as "red only on CI", and this project already
      # paid for it once: `check-cycles` shipped a hard-coded `D:/…` that passed locally and failed on
      # every push (#118). The fix is the same in both directions — make the CI-only branch reachable
      # from here, which `run-gate.mjs --simulate-missing-compiler` does (it is exercised by a test).
      #
      # `run-gate.mjs` is byte-identical in all four repositories and checks its own copies by hashing
      # its siblings — one RESOURCE rule, four repositories, one implementation.
      # ⚠️ 引号是必需的，不是风格：值里的 `: `（冒号+空格）在 YAML 里是 mapping 指示符，
      #    不加引号会让**整个 workflow 解析失败** —— run 会被创建但产出 0 个 job，
      #    所有门禁一条都不跑，而本地 `npm run check` 全绿（本地从不解析 workflows）。
      #    实测事故：run 44002473416（2026-11-17），CI 红了 6 个提交却没有任何 job 日志可看。
      #    守护判据：`test/v220-workflow-yaml-safe.test.mjs`（四仓逐字节相同）。
      - name: "Incremental type budget (RESOURCE-aware: no compiler on the runner)"
        run: node scripts/run-gate.mjs scripts/type-budget.mjs

      - name: Concurrency test (spawns 8 real processes — run SEPARATELY, and it is NOT skipped)
        # ── WHY THIS IS ITS OWN STEP, AND WHY THAT IS NOT A SKIP ────────────────────────────────────
        #
        # This file spawns eight `node` processes that contend for ONE lock, so its resource need is
        # genuinely exclusive. Measured inside the full parallel suite: one run in five failed, and a
        # separate run took 82 SECONDS (against 1.4s in isolation) — because each of the worker's 40
        # retry attempts can burn a 2s guard wait when seven others are queued ahead of it.
        #
        # A test whose timing depends on how busy the rest of the suite is produces the worst kind of
        # red: real-looking and unreproducible. So it moved out of `test/*.test.mjs` into
        # `test-concurrency/` — and it is run HERE, in the same job, on every push.
        #
        # WHAT WOULD MAKE THIS A SKIP, and what this deliberately is not: deleting the step, `|| true`,
        # or an `if:` that lets it be tree-lined away. If this step is ever removed, the lost-update
        # guarantee across PROCESSES stops being verified anywhere — which is the one thing the file
        # exists for.
        #
        # `--test-concurrency=1` because the point is these eight processes contending with each other,
        # not with another copy of themselves.
        run: npm run test:concurrency
