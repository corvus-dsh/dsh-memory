# CI — rebuild, prove the committed artifact is current, then test.
#
# THE FAILURE THIS CATCHES
#
# `lib/` is committed build output. A test suite can be fully green against `src/` while `lib/` is
# one edit behind — and the consumer loads `lib/`. That is "tests green, artifact broken", and it is
# invisible unless CI rebuilds and diffs.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Show the runtime we are actually testing on
        run: node --version && npm --version

      - name: Check out the layer this store's lock is built on
        # ── WHY THIS REPO NEEDS A SIBLING CHECKOUT AT ALL ──────────────────────────────────────
        #
        # `src/lock.ts` does NOT own a lock implementation. It delegates to the SYNCHRONOUS LEASE
        # ADAPTER in `dsh-paradise` (`createSyncLeaseAdapter`), and that is deliberate: the older
        # `mkdir` lock had a real race (a reclaimer could delete the directory between `mkdir` and
        # writing `owner`, crashing the writer that had already won) and was replaced rather than
        # patched.
        #
        # `src/lease-bridge.ts` then FAILS CLOSED when the layer is absent — `acquireFileLock` throws
        # instead of silently using a racy lock. So on a machine without `dsh-paradise`, every write
        # path in this store dies, which is what the suite exercised here: `appendNegatives` is called
        # by a large share of the tests, and the multi-process ones spawn child processes that hit the
        # same wall.
        #
        # CI checked out ONLY this repo, so the layer was never present and the suite was red for a
        # reason that has nothing to do with the code under test.
        #
        # ⚠️ The checkout path MUST stay INSIDE this job's workspace. `actions/checkout` refuses a
        # destination it cannot prove is under `$GITHUB_WORKSPACE`:
        #
        #   Repository path '/home/runner/work/<repo>/dsh-paradise-checkout'
        #   is not under '/home/runner/work/<repo>/<repo>'
        #
        # So it lands in a staging directory inside the workspace and the next step MOVES it out to
        # the sibling position that `leaseSpecifiers()` probes (`../../dsh-paradise/index.js`,
        # `../dsh-paradise/index.js`, then the bare package name).
        uses: actions/checkout@v4
        with:
          repository: corvus-dsh/dsh-paradise
          path: .siblings/dsh-paradise

      - name: Place the layer where the lease probes expect it
        # The probes look for the DIRECTORY NAME `dsh-paradise` beside this repo, not the scoped
        # package name: `@corvus-dsh/dsh-paradise` is a module specifier, the folder is `dsh-paradise`.
        run: |
          set -e
          mv .siblings/dsh-paradise ../dsh-paradise
          rm -rf .siblings
          node -e "console.log('lease layer at', require('node:fs').realpathSync('../dsh-paradise/index.js'))"

      - name: Install (no dependencies expected)
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: The build must not leave the committed artifact stale
        # WHY `git diff --exit-code` AND NOT `git status --porcelain`
        #
        # The question is "did the build change what ships". `git status` does not answer that
        # question: it compares against the stat cache and folds in attributes, so it can print
        # ` M` for a worktree file whose filtered CONTENT is identical to the committed blob (the
        # "LF will be replaced by CRLF the next time Git touches it" case).
        #
        # `git diff --exit-code` compares content after the repo's configured filters, which is the
        # same normalization `git status` applies — so it agrees with `status` on real edits but not
        # on pending-EOL noise. That is exactly the discrimination this gate needs.
        #
        # ⚠️ DO NOT "fix" this by pinning `core.autocrlf=false`. That disables the normalization
        # instead of relying on it, and on a worktree with CRLF bytes it turns pure EOL churn into a
        # whole-file diff. Measured on this repo: `lib/index.js` has 1664 CR bytes in the worktree,
        # plain `git diff` exits 0, and `git -c core.autocrlf=false diff` reports 7 files changed /
        # 7674 insertions / 7674 deletions of NOTHING. The pinned form fails on every Windows machine
        # while the real gate passes on both.
        run: |
          if ! git diff --exit-code -- lib; then
            echo "::error::The build changed committed artifacts. Run 'npm run build' and commit the result."
            git --no-pager diff --stat -- lib
            exit 1
          fi
          echo "ok: lib/ matches the committed artifact"

      - name: Syntax-check the shipped entry point
        run: node --check lib/index.js

      - name: Test
        run: npm test
