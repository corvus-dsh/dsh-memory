# dsh-memory bundle patch: inserts the host row into the profile's plugin roster.
# Install with `dsh plugin --profile <name> add <path-or-git-url>`; the bundle
# patch is applied automatically, so do NOT insert this row again in the profile
# patch (duplicate ids crash the loader).
- insert:
    - id: dsh-memory
      name: 'dsh-memory'
      config:
        # Where the slicing plugin keeps .retired.json / .transferred.json.
        # Read-only: dsh-memory never imports that plugin, it only reads the files.
        graftDataDir: ''
        # Where skills are written. Empty = ~/.agents/skills (the dir DSH's own
        # skill loader already scans).
        skillsDir: ''
        # Local store for negatives.jsonl / processed.json / index.json.
        memoryDir: ''
        # One harvest call handles at most this many retired sessions.
        harvestLimit: 3
        # 'llm' extracts with the host model; 'off' disables extraction (ledger
        # scan only, useful for verifying the wiring before spending tokens).
        extractor: 'llm'
        # v0.4 retrieval: the lexical net recalls at 0.20; the LLM adjudicates.
        retrievalFloor: 0.20
        semanticFilter: true
        # Strict bar, used only when semanticFilter is false (pure offline mode).
        retrievalThreshold: 0.55
        # v0.8 WORKSPACE ISOLATION (on by default — do not turn off).
        #
        #   write side: every memory records the cwd of the session that produced
        #     it — a `workspace:` field in SKILL.md frontmatter, and a `workspace`
        #     field in negatives/facts/experiences. The value is read from the
        #     session log header, never from the extraction model.
        #   read side: a memory is eligible only when `scope: global`, or its
        #     recorded workspace equals the asking turn's cwd. Foreign workspaces
        #     AND unscoped legacy records are refused: fail closed, because the cost
        #     of a wrong recall is a wrong ACTION.
        #
        # Turn it off only to inspect the unfiltered store in a diagnostic run.
        workspaceIsolation: true
        # v0.15 双时态：检索只激活 invalid_at 为空或晚于当前时间的记忆；取代由
        # retrieve 的 LLM 裁决阶段判定，落盘走 store.applySupersede（含人工否决权与
        # <memoryDir>/.memory-audit.jsonl 审计）。无需配置开关——失效即不再召回。
        # 注入提示中，非 human 来源会带 [来源：工具推断，请核实]。